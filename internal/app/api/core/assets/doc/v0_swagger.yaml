basePath: /api/v0
definitions:
  model.AuditEntry:
    properties:
      ContextUser:
        type: string
      Id:
        type: integer
      Message:
        type: string
      Origin:
        description: 'origin: for example user auth, stats, ...'
        type: string
      Severity:
        type: string
      Timestamp:
        type: string
    type: object
  model.BulkPeerRequest:
    properties:
      Identifiers:
        items:
          type: string
        type: array
      Reason:
        type: string
    required:
    - Identifiers
    type: object
  model.ConfigOption-array_string:
    properties:
      Overridable:
        type: boolean
      Value:
        items:
          type: string
        type: array
    type: object
  model.ConfigOption-int:
    properties:
      Overridable:
        type: boolean
      Value:
        type: integer
    type: object
  model.ConfigOption-string:
    properties:
      Overridable:
        type: boolean
      Value:
        type: string
    type: object
  model.ConfigOption-uint32:
    properties:
      Overridable:
        type: boolean
      Value:
        type: integer
    type: object
  model.Error:
    properties:
      Code:
        type: integer
      Message:
        type: string
    type: object
  model.ExpiryDate:
    properties:
      time.Time:
        type: string
    type: object
  model.HaExitCheck:
    properties:
      At:
        type: string
      ExpectedIp:
        type: string
      Ok:
        type: boolean
      Result:
        type: string
    type: object
  model.HaJoinToken:
    properties:
      CreatedAt:
        type: string
      CreatedBy:
        type: string
      ExpiresAt:
        type: string
      Id:
        type: string
      UsesLeft:
        type: integer
    type: object
  model.HaJoinTokenRequest:
    properties:
      Uses:
        type: integer
      ValidHours:
        type: integer
    type: object
  model.HaJoinTokenResponse:
    properties:
      Token:
        type: string
    type: object
  model.HaNode:
    properties:
      ConnectedPeers:
        description: fresh sessions seen by this node, HA probe peers excluded
        type: integer
      ConsecutiveFails:
        type: integer
      IsActive:
        type: boolean
      LastHeartbeat:
        type: string
      LastProbeAt:
        type: string
      LastProbeOk:
        type: boolean
      LastProbeResult:
        type: string
      NodeId:
        type: string
      Priority:
        type: integer
      PublicIp:
        type: string
      RegisteredAt:
        type: string
    type: object
  model.HaStatus:
    properties:
      ActiveNodeId:
        type: string
      ChangedAt:
        type: string
      ChangedBy:
        type: string
      ExitCheck:
        $ref: '#/definitions/model.HaExitCheck'
      JoinTokens:
        items:
          $ref: '#/definitions/model.HaJoinToken'
        type: array
      Nodes:
        items:
          $ref: '#/definitions/model.HaNode'
        type: array
      Role:
        type: string
    type: object
  model.Interface:
    properties:
      Addresses:
        description: the interface ip addresses
        items:
          type: string
        type: array
      Backend:
        description: the backend used for this interface e.g., local, mikrotik, ...
        example: local
        type: string
      CreateDefaultPeer:
        description: if true, default peers will be created for this interface
        type: boolean
      Disabled:
        description: flag that specifies if the interface is enabled (up) or not (down)
        type: boolean
      DisabledReason:
        description: the reason why the interface has been disabled
        type: string
      DisplayName:
        description: a nice display name/ description for the interface
        type: string
      Dns:
        description: the dns server that should be set if the interface is up, comma
          separated
        items:
          type: string
        type: array
      DnsSearch:
        description: the dns search option string that should be set if the interface
          is up, will be appended to DnsStr
        items:
          type: string
        type: array
      EnabledPeers:
        type: integer
      Filename:
        description: 'the filename of the config file, for example: wg0.conf'
        type: string
      FirewallMark:
        description: a firewall mark
        type: integer
      Identifier:
        description: 'device name, for example: wg0'
        example: wg0
        type: string
      IsDynamic:
        description: specifies if the interface is a dynamic object
        type: boolean
      ListenPort:
        description: 'the listening port, for example: 51820'
        type: integer
      Mode:
        description: the interface type, either 'server', 'client' or 'any'
        example: server
        type: string
      Mtu:
        description: the device MTU
        type: integer
      PeerDefAllowedIPs:
        description: the default allowed IP string for the peer
        items:
          type: string
        type: array
      PeerDefDns:
        description: the default dns server for the peer
        items:
          type: string
        type: array
      PeerDefDnsSearch:
        description: the default dns search options for the peer
        items:
          type: string
        type: array
      PeerDefEndpoint:
        description: the default endpoint for the peer
        type: string
      PeerDefFirewallMark:
        description: default firewall mark
        type: integer
      PeerDefMtu:
        description: the default device MTU
        type: integer
      PeerDefNetwork:
        description: the default subnets from which peers will get their IP addresses,
          comma seperated
        items:
          type: string
        type: array
      PeerDefPersistentKeepalive:
        description: the default persistent keep-alive Value
        type: integer
      PeerDefPostDown:
        description: default action that is executed after the device is down
        type: string
      PeerDefPostUp:
        description: default action that is executed after the device is up
        type: string
      PeerDefPreDown:
        description: default action that is executed before the device is down
        type: string
      PeerDefPreUp:
        description: default action that is executed before the device is up
        type: string
      PeerDefRoutingTable:
        description: the default routing table
        type: string
      PostDown:
        description: action that is executed after the device is down
        type: string
      PostUp:
        description: action that is executed after the device is up
        type: string
      PreDown:
        description: action that is executed before the device is down
        type: string
      PreUp:
        description: action that is executed before the device is up
        type: string
      PrivateKey:
        description: private Key of the server interface
        example: abcdef==
        type: string
      PublicKey:
        description: public Key of the server interface
        example: abcdef==
        type: string
      RoutingTable:
        description: the routing table
        type: string
      SaveConfig:
        description: automatically persist config changes to the wgX.conf file
        type: boolean
      TotalPeers:
        type: integer
    type: object
  model.LoginProviderInfo:
    properties:
      CallbackUrl:
        example: /auth/google/callback
        type: string
      Identifier:
        example: google
        type: string
      Name:
        example: Login with Google
        type: string
      ProviderUrl:
        example: /auth/google/login
        type: string
    type: object
  model.LogoutResponse:
    properties:
      Message:
        type: string
      RedirectUrl:
        type: string
    type: object
  model.MultiPeerRequest:
    properties:
      Identifiers:
        items:
          type: string
        type: array
      Prefix:
        type: string
    type: object
  model.Peer:
    properties:
      Addresses:
        description: the interface ip addresses
        items:
          type: string
        type: array
      AllowedIPs:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-array_string'
        description: all allowed ip subnets, comma seperated
      CheckAliveAddress:
        description: optional ip address or DNS name that is used for ping checks
        type: string
      Disabled:
        description: flag that specifies if the peer is enabled (up) or not (down)
        type: boolean
      DisabledReason:
        description: the reason why the peer has been disabled
        type: string
      DisplayName:
        description: a nice display name/ description for the peer
        type: string
      Dns:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-array_string'
        description: the dns server that should be set if the interface is up, comma
          separated
      DnsSearch:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-array_string'
        description: the dns search option string that should be set if the interface
          is up, will be appended to DnsStr
      Endpoint:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: the endpoint address
      EndpointPublicKey:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: the endpoint public key
      ExpiresAt:
        allOf:
        - $ref: '#/definitions/model.ExpiryDate'
        description: expiry dates for peers
      ExtraAllowedIPs:
        description: all allowed ip subnets on the server side, comma seperated
        items:
          type: string
        type: array
      Filename:
        description: 'the filename of the config file, for example: wg_peer_x.conf'
        type: string
      FirewallMark:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-uint32'
        description: a firewall mark
      Identifier:
        description: peer unique identifier
        example: super_nice_peer
        type: string
      InterfaceIdentifier:
        description: the interface id
        type: string
      IsDynamic:
        description: specifies if the peer is dynamically created by mikrotik
        type: boolean
      Mode:
        description: the peer interface type (server, client, any)
        type: string
      Mtu:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-int'
        description: the device MTU
      Notes:
        description: a note field for peers
        type: string
      PersistentKeepalive:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-int'
        description: the persistent keep-alive interval
      PostDown:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: action that is executed after the device is down
      PostUp:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: action that is executed after the device is up
      PreDown:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: action that is executed before the device is down
      PreUp:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: action that is executed before the device is up
      PresharedKey:
        description: the pre-shared Key of the peer
        type: string
      PrivateKey:
        description: private Key of the server peer
        example: abcdef==
        type: string
      PublicKey:
        description: public Key of the server peer
        example: abcdef==
        type: string
      RoutingTable:
        allOf:
        - $ref: '#/definitions/model.ConfigOption-string'
        description: the routing table
      UserDisplayName:
        description: the owner display name
        type: string
      UserIdentifier:
        description: the owner
        type: string
    type: object
  model.PeerMailRequest:
    properties:
      Identifiers:
        items:
          type: string
        type: array
      LinkOnly:
        type: boolean
    type: object
  model.PeerStatData:
    properties:
      BytesReceived:
        type: integer
      BytesTransmitted:
        type: integer
      EndpointAddress:
        type: string
      IsConnected:
        type: boolean
      IsPingable:
        type: boolean
      LastHandshake:
        type: string
      LastPing:
        type: string
      LastSessionStart:
        type: string
    type: object
  model.PeerStats:
    properties:
      Enabled:
        description: peer stats tracking enabled
        example: true
        type: boolean
      Stats:
        additionalProperties:
          $ref: '#/definitions/model.PeerStatData'
        description: stats, map key = Peer identifier
        type: object
    type: object
  model.RoutingActiveExitRequest:
    properties:
      PeerIdentifier:
        description: 'empty: no exit'
        type: string
    type: object
  model.RoutingExitCandidate:
    properties:
      DisplayName:
        type: string
      EgressIp:
        type: string
      PeerIdentifier:
        type: string
    type: object
  model.RoutingExitCandidateRequest:
    properties:
      EgressIp:
        type: string
      PeerIdentifier:
        type: string
    type: object
  model.RoutingExitInterface:
    properties:
      ActivePeerIdentifier:
        description: 'empty: no exit active'
        type: string
      Candidates:
        items:
          $ref: '#/definitions/model.RoutingExitCandidate'
        type: array
      Detected:
        description: 'Detected: peers with 0.0.0.0/0 or ::/0 that are no candidates
          (EgressIp empty)'
        items:
          $ref: '#/definitions/model.RoutingExitCandidate'
        type: array
      InterfaceIdentifier:
        type: string
    type: object
  model.RoutingList:
    properties:
      Content:
        description: only in GET /routing/lists/{id}
        type: string
      Enabled:
        type: boolean
      EntryCount:
        type: integer
      Id:
        type: string
      Kind:
        description: blackhole or bypass
        type: string
      Name:
        type: string
      UpdatedAt:
        type: string
      UpdatedBy:
        type: string
    type: object
  model.RoutingListRequest:
    properties:
      Content:
        description: 'omitted or null on PUT: keep the current content'
        type: string
      Enabled:
        type: boolean
      Kind:
        type: string
      Name:
        type: string
    type: object
  model.RoutingSettings:
    properties:
      DnsForwarderEnabled:
        type: boolean
      DnsUpstreams:
        items:
          type: string
        type: array
    type: object
  model.SessionInfo:
    properties:
      DefaultPasswordInUse:
        type: boolean
      IsAdmin:
        type: boolean
      LoggedIn:
        type: boolean
      UserEmail:
        type: string
      UserFirstname:
        type: string
      UserIdentifier:
        type: string
      UserLastname:
        type: string
    type: object
  model.Settings:
    properties:
      ApiAdminOnly:
        type: boolean
      AvailableBackends:
        items:
          $ref: '#/definitions/model.SettingsBackendNames'
        type: array
      CreateDefaultPeer:
        type: boolean
      EditableKeys:
        type: boolean
      LoginFormVisible:
        type: boolean
      MailLinkOnly:
        type: boolean
      MinPasswordLength:
        type: integer
      PersistentConfigSupported:
        type: boolean
      SelfProvisioning:
        type: boolean
      WebAuthnEnabled:
        type: boolean
    type: object
  model.SettingsBackendNames:
    properties:
      Id:
        type: string
      Name:
        type: string
      Type:
        type: string
    type: object
  model.User:
    properties:
      ApiEnabled:
        type: boolean
      ApiToken:
        type: string
      ApiTokenCreated:
        type: string
      AuthSources:
        items:
          type: string
        type: array
      DefaultPasswordInUse:
        type: boolean
      Department:
        type: string
      Disabled:
        description: if this field is set, the user is disabled
        type: boolean
      DisabledReason:
        description: the reason why the user has been disabled
        type: string
      Email:
        type: string
      Firstname:
        type: string
      Identifier:
        type: string
      IsAdmin:
        type: boolean
      Lastname:
        type: string
      Locked:
        description: if this field is set, the user is locked
        type: boolean
      LockedReason:
        description: the reason why the user has been locked
        type: string
      Notes:
        type: string
      Password:
        type: string
      PeerCount:
        type: integer
      PersistLocalChanges:
        type: boolean
      Phone:
        type: string
    type: object
  model.WebAuthnCredentialRequest:
    properties:
      Name:
        type: string
    type: object
  model.WebAuthnCredentialResponse:
    properties:
      CreatedAt:
        type: string
      ID:
        type: string
      Name:
        type: string
    type: object
info:
  contact:
    name: WireGuard Portal Developers
    url: https://github.com/h44z/wg-portal
  description: WireGuard Portal API - UI Endpoints
  title: WireGuard Portal SPA-UI API
  version: "0.0"
paths:
  /audit/entries:
    get:
      operationId: audit_handleEntriesGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AuditEntry'
            type: array
      summary: Get all available audit entries. Ordered by timestamp.
      tags:
      - Audit
  /auth/login:
    post:
      operationId: auth_handleLoginPost
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.LoginProviderInfo'
            type: array
      summary: Get all available external login providers.
      tags:
      - Authentication
  /auth/login/{provider}/callback:
    get:
      operationId: auth_handleOauthCallbackGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.LoginProviderInfo'
            type: array
      summary: Handle the OAuth callback.
      tags:
      - Authentication
  /auth/login/{provider}/init:
    get:
      operationId: auth_handleOauthInitiateGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.LoginProviderInfo'
            type: array
      summary: Initiate the OAuth login flow.
      tags:
      - Authentication
  /auth/logout:
    post:
      operationId: auth_handleLogoutPost
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LogoutResponse'
      summary: Get all available external login providers.
      tags:
      - Authentication
  /auth/providers:
    get:
      operationId: auth_handleExternalLoginProvidersGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.LoginProviderInfo'
            type: array
      summary: Get all available external login providers.
      tags:
      - Authentication
  /auth/session:
    get:
      operationId: auth_handleSessionInfoGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.SessionInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Error'
      summary: Get information about the currently logged-in user.
      tags:
      - Authentication
  /auth/webauthn/credential/{id}:
    delete:
      operationId: auth_handleWebAuthnCredentialsDelete
      parameters:
      - description: Base64 encoded Credential ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.WebAuthnCredentialResponse'
            type: array
      summary: Delete a WebAuthn credential.
      tags:
      - Authentication
    put:
      operationId: auth_handleWebAuthnCredentialsPut
      parameters:
      - description: Base64 encoded Credential ID
        in: path
        name: id
        required: true
        type: string
      - description: Credential name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.WebAuthnCredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.WebAuthnCredentialResponse'
            type: array
      summary: Update a WebAuthn credential.
      tags:
      - Authentication
  /auth/webauthn/credentials:
    get:
      operationId: auth_handleWebAuthnCredentialsGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.WebAuthnCredentialResponse'
            type: array
      summary: Get all available external login providers.
      tags:
      - Authentication
  /auth/webauthn/login/finish:
    post:
      operationId: auth_handleWebAuthnLoginFinish
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
      summary: Finish the WebAuthn login process.
      tags:
      - Authentication
  /auth/webauthn/register/finish:
    post:
      operationId: auth_handleWebAuthnRegisterFinish
      parameters:
      - default: '""'
        description: Credential name
        in: query
        name: credential_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.WebAuthnCredentialResponse'
            type: array
      summary: Finish the WebAuthn registration process.
      tags:
      - Authentication
  /config/frontend.js:
    get:
      operationId: config_handleConfigJsGet
      produces:
      - text/javascript
      responses:
        "200":
          description: The JavaScript contents
          schema:
            type: string
        "500":
          description: Internal Server Error
      summary: Get the dynamic frontend configuration javascript.
      tags:
      - Configuration
  /config/settings:
    get:
      operationId: config_handleSettingsGet
      produces:
      - application/json
      responses:
        "200":
          description: The JavaScript contents
          schema:
            type: string
      summary: Get the frontend settings object.
      tags:
      - Configuration
  /csrf:
    get:
      operationId: base_handleCsrfGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get a CSRF token for the current session.
      tags:
      - Security
  /ha/join-tokens:
    post:
      operationId: ha_handleJoinTokenPost
      parameters:
      - description: Validity and number of uses
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.HaJoinTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HaJoinTokenResponse'
      summary: Create a node join token.
      tags:
      - HA
  /ha/join-tokens/{id}:
    delete:
      operationId: ha_handleJoinTokenDelete
      parameters:
      - description: The token id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
      summary: Revoke a node join token.
      tags:
      - HA
  /ha/nodes/{id}:
    delete:
      operationId: ha_handleNodeDelete
      parameters:
      - description: The node id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
      summary: Remove a (non-active) node from the cluster.
      tags:
      - HA
  /ha/promote/{id}:
    post:
      operationId: ha_handlePromotePost
      parameters:
      - description: The node id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
      summary: Promote a node to be the active node and point DNS at it.
      tags:
      - HA
  /ha/status:
    get:
      operationId: ha_handleStatusGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HaStatus'
      summary: Get the HA cluster status (nodes, active node, join tokens).
      tags:
      - HA
  /hostname:
    get:
      description: Nothing more to describe...
      operationId: test_handleHostnameGet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Error'
      summary: Get the current host name.
      tags:
      - Testing
  /interface/{id}:
    delete:
      operationId: interfaces_handleDelete
      parameters:
      - description: The interface identifier
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content if deletion was successful
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.Error'
      summary: Delete the interface record.
      tags:
      - Interface
    put:
      operationId: interfaces_handleUpdatePut
      parameters:
      - description: The interface identifier
        in: path
        name: id
        required: true
        type: string
      - description: The interface data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.Interface'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Interface'
        "400":
          description: Bad Request
          schema:
